name: Update trends

on:
  schedule:
    - cron: "7,37 * * * *"   # every 30 minutes
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["docs/index.html", "docs/app.js", "docs/style.css", "config.json", "scripts/**", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-trends
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch trends
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        run: python scripts/fetch_trends.py

      - name: Save data to the repo
        run: |
          git config user.name "trend-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs/data
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "data: trends $(date -u +'%Y-%m-%d %H:%M UTC')" --quiet
            git pull --rebase --quiet || true
            git push --quiet
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
